
name: Diagnose GitHub OIDC

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect OIDC claims safely
        uses: actions/github-script@v7
        with:
          script: |
            const tokenUrl = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
            const requestToken = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;

            const response = await fetch(
              `${tokenUrl}&audience=sts.amazonaws.com`,
              { headers: { Authorization: `Bearer ${requestToken}` } }
            );

            if (!response.ok) {
              throw new Error(`OIDC request failed: HTTP ${response.status}`);
            }

            const data = await response.json();
            const claims = JSON.parse(
              Buffer.from(data.value.split('.')[1], 'base64url').toString()
            );

            core.info(`sub: ${claims.sub}`);
            core.info(`aud: ${claims.aud}`);
